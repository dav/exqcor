name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Vet and test server
        run: |
          cd server
          go vet ./...
          go test ./...

      - name: Cross-compile smoke (windows, linux-arm64)
        run: |
          cd server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/exqcor
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/exqcor
